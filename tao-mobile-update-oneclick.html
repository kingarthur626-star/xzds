<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">
  <meta name="theme-color" content="#f8fafc" />
  <meta name="xzds-ui-version" content="20260808-tao-mobile-oneclick-030r2f2" />

  <title>道親資料更新－一鍵更新｜新莊區道務檢視</title>

  <link rel="stylesheet" href="css/style.css?v=20260808-tao-mobile-oneclick-030r2f2" />
</head>

<body class="tao-mobile-update-page">
  <div class="page">
    <div class="page-inner">

      <div class="page-action-bar three-actions tao-mobile-action-bar">
        <button class="action-pill logout" id="logoutBtn" type="button">登出</button>
        <button class="action-pill" id="refreshStatusBtn" type="button">重新整理</button>
        <button class="action-pill" id="backHomeBtn" type="button">首頁</button>
      </div>

      <main class="card wide-card tao-mobile-card">
        <h1>道親資料更新</h1>
        <div class="small-text tao-mobile-subtitle">一鍵更新：選定期間後按一次，自動完成第1～第4步</div>

        <div id="taoMobileMessage" class="message" role="status" aria-live="polite"></div>

        <section class="tao-mobile-range-panel" aria-labelledby="rangeTitle">
          <h2 id="rangeTitle">更新期間</h2>

          <div class="tao-mobile-date-grid">
            <label class="tao-mobile-date-field">
              <span>開始日期</span>
              <input id="startDateInput" type="date" autocomplete="off" />
            </label>

            <label class="tao-mobile-date-field">
              <span>結束日期</span>
              <input id="endDateInput" type="date" autocomplete="off" />
            </label>
          </div>

          <div class="tao-mobile-range-actions">
            <button id="loadRangeBtn" class="tao-mobile-secondary-btn" type="button">查詢此期間狀態</button>
            <button id="runAllBtn" class="tao-mobile-primary-btn" type="button">一鍵執行第1～第4步</button>
          </div>

          <div id="oneClickHint" class="tao-mobile-range-note">
            系統會在背景逐步驗證；手機關閉後仍會繼續。
          </div>
        </section>

        <section id="oneClickBanner" class="tao-mobile-oneclick-banner" hidden>
          <div class="tao-mobile-oneclick-head">
            <div>
              <div class="tao-mobile-oneclick-title">一鍵到底</div>
              <div id="oneClickStatusText" class="tao-mobile-oneclick-status"></div>
            </div>
            <strong id="oneClickProgressText">0／4</strong>
          </div>
          <div class="tao-mobile-oneclick-track" aria-label="一鍵流程進度">
            <i id="oneClickProgressBar"></i>
          </div>
          <div id="oneClickStepText" class="tao-mobile-oneclick-step"></div>
          <div id="oneClickErrorText" class="tao-mobile-oneclick-error" hidden></div>
        </section>

        <section id="operationBanner" class="tao-mobile-operation-banner" hidden>
          <div class="tao-mobile-operation-title" id="operationTitle">目前作業</div>
          <div class="tao-mobile-operation-text" id="operationText"></div>
        </section>

        <section id="stepList" class="tao-mobile-step-list" aria-label="更新步驟">
          <div class="tao-mobile-loading">讀取狀態中...</div>
        </section>

        <button id="toggleDetailsBtn" class="tao-mobile-progress-btn" type="button" disabled>
          查看進度與結果
        </button>

        <section id="detailsPanel" class="tao-mobile-details" hidden>
          <h2>進度與結果</h2>
          <div id="detailsContent"></div>
        </section>

        <div id="generatedAtText" class="small-text tao-mobile-generated-at"></div>
      </main>

    </div>
  </div>

  <script src="js/config.js?v=20260620-1"></script>
  <script src="js/api.js?v=20260812-api-stability-032r2"></script>
  <script src="js/common.js?v=20260620-1"></script>
  <script src="js/tao-mobile-update-oneclick.js?v=20260808-tao-mobile-oneclick-030r2f2"></script>
</body>
</html>
