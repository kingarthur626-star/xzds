<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">
  <meta name="xzds-ui-version" content="20260803-019" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>道務活動設定</title>

  <link rel="stylesheet" href="css/style.css?v=20260803-19" />

  <style>
    a.action-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .duty-status-note-grid {
      display: grid;
      grid-template-columns: minmax(96px, 1fr) minmax(0, 4fr);
      gap: 12px;
      align-items: end;
    }

    .duty-status-note-grid .form-group {
      min-width: 0;
    }

    @media (max-width: 520px) {
      .duty-status-note-grid {
        grid-template-columns: minmax(88px, 1fr) minmax(0, 4fr);
        gap: 8px;
      }
    }
  </style>
</head>
<body class="duty-activity-page">
  <div class="page">
    <div class="page-inner">

      <div class="page-action-bar">
        <a class="action-pill" id="backBtn" href="./duty-activity-list.html">道務活動列表</a>
        <button class="action-pill logout" id="logoutBtn" type="button">登出</button>
      </div>

      <div class="card wide-card duty-activity-card">
        <h1>道務活動設定</h1>

        <div class="small-text">新增、修改與停用道務活動</div>

        <div id="dutyActivityMessage" class="message"></div>
        <form id="dutyActivityForm" class="duty-activity-form">
          <input id="activityId" type="hidden" />

          <div class="duty-form-grid two">
            <div class="form-group">
              <label for="dateStart">日期起</label>
              <input id="dateStart" type="date" />
            </div>

            <div class="form-group">
              <label for="dateEnd">日期訖</label>
              <input id="dateEnd" type="date" />
            </div>
          </div>

          <div class="form-group">
            <label for="activityName">道務活動</label>
            <select id="activityName">
              <option value="">請選擇</option>
              <option value="孝親活動">孝親活動</option>
              <option value="報恩法會">報恩法會</option>
              <option value="樂活養生嘉年華">樂活養生嘉年華</option>
              <option value="親其親班務法會">親其親班務法會</option>
              <option value="護經闖關">護經闖關</option>
              <option value="觀音孝親祈福">觀音孝親祈福</option>
              <option value="觀音辦道週">觀音辦道週</option>
              <option value="__CUSTOM__">自行輸入</option>
            </select>
            <input id="activityNameCustom" type="text" placeholder="自行輸入道務活動" autocomplete="off" style="display:none; margin-top:8px;" />
          </div>

          <div class="duty-form-grid two">
            <div class="form-group">
              <label for="peopleMode">人數模式</label>
              <select id="peopleMode">
                <option value="手動">手動</option>
                <option value="求道統計">求道統計</option>
                <option value="求道統計+壇名">求道統計+壇名</option>
                <option value="法會統計">法會統計</option>
                <option value="法會統計+壇名">法會統計+壇名</option>
              </select>
            </div>

            <div class="form-group">
              <label for="peopleCount">人數</label>
              <input id="peopleCount" type="number" min="0" step="1" placeholder="手動輸入" inputmode="numeric" />
            </div>
          </div>

          <div class="duty-form-grid two">
            <div class="form-group">
              <label for="location">地點</label>
              <select id="location">
                <option value="">可空白</option>
                <option value="崇慧">崇慧</option>
                <option value="耕德">耕德</option>
                <option value="__CUSTOM__">自行輸入</option>
              </select>
              <input id="locationCustom" type="text" placeholder="自行輸入地點" autocomplete="off" style="display:none; margin-top:8px;" />
            </div>

            <div class="form-group">
              <label for="planning">規劃</label>
              <select id="planning">
                <option value="">請選擇</option>
                <option value="區">區</option>
                <option value="一組">一組</option>
                <option value="二組">二組</option>
                <option value="三組">三組</option>
              </select>
            </div>
          </div>

          <div class="duty-status-note-grid">
            <div class="form-group">
              <label for="activityStatus">狀態</label>
              <select id="activityStatus">
                <option value="啟用">啟用</option>
                <option value="停用">停用</option>
              </select>
            </div>

            <div class="form-group">
              <label for="activityNote">備註</label>
              <input id="activityNote" type="text" placeholder="可空白" autocomplete="off" />
            </div>
          </div>

          <div class="duty-form-actions">
            <button id="saveActivityBtn" class="btn duty-save-btn" type="submit">新增活動</button>
            <button id="clearActivityBtn" class="duty-secondary-btn" type="button">清空</button>
          </div>
        </form>

        <div class="duty-list-head">
          <div id="dutyActivityStats" class="small-text">讀取中...</div>
          <button id="reloadActivityBtn" class="admin-small-btn" type="button">重新整理</button>
        </div>

        <div id="dutyActivityList" class="duty-activity-list">
          <div class="small-text">讀取道務活動中...</div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/config.js?v=20260622-8"></script>
  <script src="js/api.js?v=20260812-api-stability-031r1"></script>
  <script src="js/common.js?v=20260622-8"></script>
  <script src="js/duty-activity-admin.js?v=20260803-19"></script>
  <script src="js/duty-activity-admin-r19.js?v=20260803-19"></script>
</body>
</html>
