<!DOCTYPE html>

<!-- =========================
     程式名稱：mobile-share.html
     功能說明：
     1. 顯示求道／法會三大組月報。
     2. 月份切換時，由後端重新讀取該月達成與 1～該月累計。
     3. 顯示目前所選報表的壇數，並在明細中段重複表頭。
     4. 產生完整 PNG，透過手機原生分享選單分享到 LINE。

     注意事項：
     1. 本頁只讀取資料，不修改 Google Sheet。
     2. 未登入時導回登入頁。
     3. 實際權限由 Apps Script 後端再次檢查。
========================= -->

<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="xzds-ui-version" content="20260807-mobile-share-100r12">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>三大組各壇月報｜新莊區道務檢視</title>
  <meta name="theme-color" content="#f5f7fb">
  <link rel="manifest" href="./manifest.json?v=20260623-001">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css?v=20260801-5">
  <link rel="stylesheet" href="./css/mobile-share.css?v=20260807-mobile-share-100r12">
</head>
<body class="mobile-share-body">
  <main class="mobile-share-page">
    <nav class="mobile-share-fixed-nav" aria-label="頁面導覽">
      <button class="action-pill logout" id="mobileShareLogoutBtn" type="button">登出</button>
      <button class="action-pill mobile-share-nav-center" id="mobileShareSummaryBtn" type="button">三大組累計達成</button>
      <button class="action-pill" id="mobileShareHomeBtn" type="button">首頁</button>
    </nav>

    <header class="mobile-share-header">
      <h1>
        <span id="mobileShareTitle">月份成果達成</span>
        <small id="mobileShareTempleCount">--壇</small>
      </h1>
    </header>

    <section class="mobile-share-control-card" aria-label="月份與報表選擇">
      <select id="mobileShareTargetMonthSelect" aria-label="月份">
        <option value="1">1月</option>
        <option value="2">2月</option>
        <option value="3">3月</option>
        <option value="4">4月</option>
        <option value="5">5月</option>
        <option value="6">6月</option>
        <option value="7">7月</option>
        <option value="8">8月</option>
        <option value="9">9月</option>
        <option value="10">10月</option>
        <option value="11">11月</option>
        <option value="12">12月</option>
      </select>

      <div id="mobileShareTargetBadge" class="mobile-share-target-badge">目標 --%</div>

      <select id="mobileShareReportSelect" aria-label="報表">
        <option value="qiu1">求道 第一組</option>
        <option value="qiu2">求道 第二組</option>
        <option value="qiu3">求道 第三組</option>
        <option value="fa1">法會 第一組</option>
        <option value="fa2">法會 第二組</option>
        <option value="fa3">法會 第三組</option>
      </select>
    </section>

    <section id="mobileShareLoading" class="mobile-share-message">讀取報表中...</section>
    <section id="mobileShareError" class="mobile-share-message error" hidden></section>

    <section id="mobileShareReport" class="mobile-share-report" hidden>
      <div class="mobile-share-summary" aria-label="大組成果摘要">
        <article class="mobile-share-summary-card">
          <span>目標</span>
          <strong id="mobileShareSummaryTarget">0</strong>
        </article>
        <article class="mobile-share-summary-card">
          <span id="mobileShareMonthCardLabel">當月達成</span>
          <strong id="mobileShareSummaryMonth">0</strong>
        </article>
        <article class="mobile-share-summary-card">
          <span id="mobileShareCumulativeCardLabel">今年累計</span>
          <strong id="mobileShareSummaryCumulative">0</strong>
        </article>
        <article class="mobile-share-summary-card mobile-share-rate-summary-card">
          <span>實際達成率</span>
          <strong id="mobileShareSummaryRate">0%</strong>
        </article>
        <article id="mobileShareStatusCard" class="mobile-share-summary-card status-card">
          <span id="mobileShareStatusLabel">目前尚缺</span>
          <strong id="mobileShareStatusValue">0</strong>
        </article>
      </div>

      <section class="mobile-share-detail-card">
        <div class="mobile-share-detail-head">
          <span>壇名</span>
          <span>目標</span>
          <span id="mobileShareDetailMonthLabel">當月</span>
          <span>累計</span>
          <span>達成率</span>
        </div>
        <div id="mobileShareDetailRows"></div>
      </section>

      <div class="mobile-share-legend" aria-label="達成率顏色說明">
        <span><i class="green"></i>達標</span>
        <span><i class="yellow"></i>差距 10% 以內</span>
        <span><i class="red"></i>落後超過 10%</span>
      </div>

      <div class="mobile-share-actions">
        <button id="mobileShareReloadBtn" class="mobile-share-secondary-btn" type="button">重新讀取</button>
        <button id="mobileShareLineBtn" class="mobile-share-line-btn" type="button">
          <span class="mobile-share-line-mark">LINE</span>
          分享成果圖片
        </button>
      </div>
    </section>
  </main>

  <script src="./js/config.js?v=20260619-2"></script>
  <script src="./js/api.js?v=20260619-2"></script>
  <script src="./js/common.js?v=20260623-04"></script>
  <script src="./js/mobile-share.js?v=20260807-mobile-share-100r12"></script>
  <script src="./js/pwa.js?v=20260801-5"></script>
</body>
</html>
