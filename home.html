<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">
  <meta name="xzds-ui-version" content="20260810-member-search-100r1">
  <title>新莊區 道務檢視</title>
  <link rel="manifest" href="./manifest.json?v=20260623-001">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="新莊區道務檢視">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css?v=20260821-r20">
  <link rel="stylesheet" href="./css/home-member-search.css?v=20260821-r21">
</head>
<body>
  <div class="home-page app-shell">
    <div class="home-card app-card">
      <div class="home-top-actions">
        <button class="home-top-action-btn logout" id="btnLogout" type="button">登出</button>
      </div>

      <h1 class="home-title">新莊區 道務檢視</h1>

      <div class="home-user">
        <div id="homeTempleName" class="home-temple">讀取中...</div>
      </div>

      <div class="home-menu">
        <button class="home-menu-btn" id="btnAnnual" type="button">
          <span class="home-menu-main">今年道務</span>
          <span class="home-menu-sub">年度統計</span>
        </button>

        <button class="home-menu-btn" id="btnHistory" type="button">
          <span class="home-menu-main">近五年道務</span>
          <span class="home-menu-sub">歷年比較</span>
        </button>

        <button id="btnDutyActivityList" class="home-menu-btn" type="button">
          <span class="home-menu-main">道務活動列表</span>
          <span class="home-menu-sub">活動查看</span>
        </button>

        <button class="home-menu-btn" id="btnMobileShare" type="button" style="display:none;">
          <span class="home-menu-main">三大組月報</span>
          <span class="home-menu-sub">成果圖片</span>
        </button>

        <button class="home-menu-btn update" id="btnDailyDataUpdate" type="button" style="display:none;">
          <span class="home-menu-main">每日資料更新</span>
          <span class="home-menu-sub">手動更新　更新記錄</span>
        </button>

        <button class="home-menu-btn member-search" id="btnMemberSearch" type="button" style="display:none;">
          <span class="home-menu-main">資料搜尋</span>
          <span class="home-menu-sub">姓名　道親編號</span>
        </button>

        <button class="home-menu-btn disabled" id="btnMore" type="button" style="display:none;">
          <span class="home-menu-main">更多功能</span>
          <span class="home-menu-sub">開發中</span>
        </button>

        <button class="home-menu-btn update" id="btnUpdate" type="button" style="display:none;">
          <span class="home-menu-main">道務報表同步</span>
          <span class="home-menu-sub">統計資料更新</span>
        </button>
      </div>

      <div id="lastUpdateText" class="home-update-time" style="display:none;"></div>
    </div>
  </div>

  <script src="./js/config.js?v=20260619-2"></script>
  <script src="./js/api.js?v=20260812-api-stability-032r2"></script>
  <script src="./js/common.js?v=20260623-04"></script>
  <script src="./js/home.js?v=20260810-member-search-100r1"></script>
  <script src="./js/pwa.js?v=20260812-api-stability-r2"></script>
</body>
</html>
