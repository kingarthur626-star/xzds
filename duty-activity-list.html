<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="xzds-ui-version" content="20260801-14" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>道務活動列表</title>
  <link rel="stylesheet" href="css/style.css?v=20260801-14" />
</head>
<body class="duty-activity-list-page">
  <div class="page">
    <div class="page-inner">
      <div class="page-action-bar unified-nav-action-bar">
        <button class="action-pill logout" id="logoutBtn" type="button">登出</button>
        <button class="action-pill" id="settingBtn" type="button">道務活動設定</button>
        <button class="action-pill" id="homeBtn" type="button">首頁</button>
      </div>

      <div class="card wide-card activity-list-card">
        <div class="activity-title-row">
          <h1>道務活動列表</h1>
          <button id="reloadActivityListBtn" class="admin-small-btn" type="button">重新整理</button>
        </div>
        <div id="activityListMessage" class="message"></div>
        <div id="activityListStats" class="small-text">讀取中...</div>
        <div id="activityListArea" class="activity-list-area">
          <div class="small-text">讀取道務活動中...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="activityDetailModal" class="activity-detail-modal" style="display: none;">
    <div class="activity-detail-mask"></div>
    <div class="activity-detail-box">
      <div id="activityDetailTitle" class="activity-detail-title"></div>
      <div id="activityDetailDate" class="activity-detail-date"></div>
      <div id="activityDetailNote" class="activity-detail-note"></div>
      <div class="activity-detail-actions">
        <button id="activityDetailCloseBtn" class="activity-detail-close-btn" type="button">關閉</button>
        <button id="activityDetailShareBtn" class="activity-detail-share-btn" type="button" disabled>圖片準備中</button>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=20260623-13"></script>
  <script src="js/api.js?v=20260623-13"></script>
  <script src="js/common.js?v=20260623-13"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/duty-activity-list.js?v=20260801-14"></script>
  <script src="./js/pwa.js?v=20260801-6"></script>
</body>
</html>
