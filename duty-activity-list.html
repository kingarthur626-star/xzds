<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">
  <meta name="xzds-ui-version" content="20260803-18-1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>道務活動列表</title>
  <link rel="stylesheet" href="css/style.css?v=20260821-r21" />
  <style>
    /* R18.1：關閉／LINE分享按鈕下方保留約三行空白。 */
    .activity-detail-bottom-spacer {
      display: block;
      width: 100%;
      height: 72px;
      min-height: 72px;
      flex: 0 0 72px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .activity-detail-bottom-spacer {
        height: 66px;
        min-height: 66px;
        flex-basis: 66px;
      }
    }
  </style>
</head>
<body class="duty-activity-list-page">
  <div class="page">
    <div class="page-inner">
      <div class="page-action-bar unified-nav-action-bar">
        <button class="action-pill logout" id="logoutBtn" type="button">登出</button>
        <button class="action-pill" id="settingBtn" type="button">道務活動設定</button>
        <button class="action-pill" id="homeBtn" type="button">首頁</button>
      </div>
      <div class="card wide-card activity-list-card">
        <div class="activity-title-row">
          <h1>道務活動列表</h1>
          <button id="reloadActivityListBtn" class="admin-small-btn" type="button">重新整理</button>
        </div>
        <div id="activityListMessage" class="message"></div>
        <div id="activityListStats" class="small-text">讀取中...</div>
        <div id="activityListArea" class="activity-list-area">
          <div class="small-text">讀取道務活動中...</div>
        </div>
      </div>
    </div>
  </div>
  <div id="activityDetailModal" class="activity-detail-modal" style="display: none;">
    <div class="activity-detail-mask"></div>
    <div class="activity-detail-box">
      <div id="activityDetailTitle" class="activity-detail-title"></div>
      <div id="activityDetailDate" class="activity-detail-date"></div>
      <div id="activityDetailNote" class="activity-detail-note"></div>
      <div class="activity-detail-actions">
        <button id="activityDetailCloseBtn" class="activity-detail-close-btn" type="button">關閉</button>
        <button id="activityDetailShareBtn" class="activity-detail-share-btn" type="button" disabled>LINE分享</button>
      </div>
      <div class="activity-detail-bottom-spacer" aria-hidden="true"></div>
    </div>
  </div>
  <script src="js/config.js?v=20260623-13"></script>
  <script src="js/api.js?v=20260812-api-stability-032r2"></script>
  <script src="js/common.js?v=20260623-13"></script>
  <script src="js/duty-activity-list.js?v=20260821-r26"></script>
  <script src="./js/pwa.js?v=20260812-api-stability-r2"></script>
</body>
</html>
